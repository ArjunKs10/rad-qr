<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Download RAD</title>

    <script>
        const userAgent = navigator.userAgent || navigator.vendor;

        // Android
        if (/android/i.test(userAgent)) {
            window.location.replace(
                "https://play.google.com/store/apps/details?id=com.radkirana.app"
            );
        }

        // iPhone / iPad / iPod
        else if (/iPhone|iPad|iPod/i.test(userAgent)) {
            window.location.replace(
                "https://apps.apple.com/in/app/rad-curated-groceries/id6798812204"
            );
        }

        // Desktop / other devices
        else {
            document.addEventListener("DOMContentLoaded", function () {
                document.body.innerHTML = `
                    <div style="
                        font-family: Arial, sans-serif;
                        text-align: center;
                        padding: 50px;
                    ">
                        <h1>Download RAD</h1>
                        <p>Please scan this QR code using your phone.</p>
                    </div>
                `;
            });
        }
    </script>
</head>

<body>
    <p>Opening RAD...</p>
</body>
</html>
